# Lint, unit tests and browser tests with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  # Every branch, so problems show up before a pull request is opened
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned app, test and lint dependencies, the same ones used locally
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # Lists the lines no test runs; fails if coverage drops under the minimum in pyproject.toml
        pytest --cov
    - name: Check dependencies for known vulnerabilities
      run: |
        pip-audit -r requirements-dev.txt

  e2e:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
    - name: Install dependencies and the browser
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        python -m playwright install --with-deps chromium
    - name: Browser tests
      run: |
        pytest -m e2e
