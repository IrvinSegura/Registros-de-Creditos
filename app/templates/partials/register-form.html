{% from "macros/credit-fields.html" import credit_fields %}
<section class="tab-pane fade show active" id="register" role="tabpanel" aria-labelledby="register-tab" tabindex="0">
    <div class="card app-card mx-auto register-card">
        <div class="card-body p-4 p-lg-5">
            <div class="section-heading mb-4">
                <span class="section-icon" aria-hidden="true"><i class="bi bi-file-earmark-plus"></i></span>
                <div>
                    <h1 class="h4 mb-1">Nuevo crédito</h1>
                    <p class="text-body-secondary mb-0">Captura los datos del crédito otorgado. Todos los campos son obligatorios.</p>
                </div>
            </div>
            <form id="credit-form" novalidate>
                {{ credit_fields() }}
                <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
                    <button type="reset" class="btn btn-outline-secondary">
                        <i class="bi bi-eraser" aria-hidden="true"></i> Limpiar
                    </button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2-circle" aria-hidden="true"></i> Registrar crédito
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
