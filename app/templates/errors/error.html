{% extends "base.html" %}

{% block title %}{{ title }} · Registro de Créditos{% endblock %}

{% block head %}
    <link href="{{ url_for('static', filename='css/views/error.css') }}" rel="stylesheet">
{% endblock %}

{% block body %}
<main class="error-page">
    <div class="error-card">
        <a class="brand error-brand" href="{{ url_for('web.index') }}">
            <span class="brand-mark" aria-hidden="true"><i class="bi bi-bank2"></i></span>
            <span class="brand-name">Registro de Créditos</span>
        </a>
        <p class="error-code" aria-hidden="true">{{ code }}</p>
        <h1 class="h3 mb-2">{{ title }}</h1>
        <p class="text-body-secondary mb-4">{{ text }}</p>
        <a href="{{ url_for('web.index') }}" class="btn btn-primary">
            <i class="bi bi-house" aria-hidden="true"></i> Volver al inicio
        </a>
    </div>
</main>
{% endblock %}
