<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Registro de Créditos{% endblock %}</title>
    <script>
        // Apply the saved or system theme before the first paint to avoid a flash
        (function () {
            let theme = null;
            try { theme = localStorage.getItem("theme"); } catch (error) { /* storage unavailable */ }
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>

<body>
    <header class="app-header">
        <div class="container d-flex align-items-center justify-content-between gap-3 py-3">
            <a class="brand" href="{{ url_for('web.index') }}">
                <span class="brand-mark" aria-hidden="true"><i class="bi bi-bank2"></i></span>
                <span class="brand-text">
                    <span class="brand-name">Registro de Créditos</span>
                    <span class="brand-tagline">Gestión de cartera crediticia</span>
                </span>
            </a>
            <button type="button" id="theme-toggle" class="btn btn-icon" aria-label="Cambiar a tema oscuro" title="Cambiar tema">
                <i class="bi bi-moon-stars" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="container pb-4 text-center small text-body-secondary">
        Registro de Créditos · <a href="/api/docs" class="link-secondary">Documentación de la API</a>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
