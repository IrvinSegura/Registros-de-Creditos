<div class="modal fade" id="password-modal" tabindex="-1" aria-labelledby="password-modal-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content app-modal" id="password-form" novalidate data-native-validation>
            <div class="modal-header">
                <div class="section-heading">
                    <span class="section-icon" aria-hidden="true"><i class="bi bi-key"></i></span>
                    <div>
                        <h2 class="modal-title h5 mb-0" id="password-modal-title">Cambiar mi contraseña</h2>
                        <p class="small text-body-secondary mb-0">Tus otras sesiones abiertas se cerrarán.</p>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                {# Lets password managers tie the new password to this account #}
                <input type="text" name="username" value="{{ current_user.username }}" autocomplete="username" hidden>
                <div class="row g-3">
                    <div class="col-12">
                        <label for="password-current_password" class="form-label">Contraseña actual</label>
                        <input type="password" id="password-current_password" name="current_password" class="form-control" required
                               autocomplete="current-password" aria-describedby="password-current_password-error">
                        <div class="invalid-feedback" id="password-current_password-error"></div>
                    </div>
                    <div class="col-12">
                        <label for="password-new_password" class="form-label">Nueva contraseña</label>
                        <input type="password" id="password-new_password" name="new_password" class="form-control" required minlength="10"
                               autocomplete="new-password" aria-describedby="password-new_password-error">
                        <div class="invalid-feedback" id="password-new_password-error"></div>
                    </div>
                    <div class="col-12">
                        <label for="password-confirm" class="form-label">Repite la nueva contraseña</label>
                        <input type="password" id="password-confirm" name="confirm" class="form-control" required minlength="10"
                               autocomplete="new-password" aria-describedby="password-confirm-error">
                        <div class="invalid-feedback" id="password-confirm-error"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check2-circle" aria-hidden="true"></i> Cambiar contraseña
                </button>
            </div>
        </form>
    </div>
</div>
