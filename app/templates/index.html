<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <title>Registro de Créditos</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body class="bg-light">
    <div class="container mt-4">
        <h1 class="text-center">Registro de Créditos</h1>
        
        <!-- Popup Notification -->
        <div id="notification" class="alert alert-success alert-dismissible fade show" style="position: fixed; top: 20px; right: 20px; z-index: 1050; display: none;" role="alert">
            <strong>¡Éxito!</strong> El crédito ha sido registrado correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Nav Tabs -->
        <ul class="nav nav-tabs" id="credit-tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab">Registro</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#list" type="button" role="tab">Créditos Registrados</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="stats-tab" data-bs-toggle="tab" data-bs-target="#stats" type="button" role="tab">Estadisticas</button>
            </li>
        </ul>
        <!-- End Nav Tabs -->

        <!-- Tab Content -->
        <div class="tab-content mt-3" id="credit-tabs-content">
            <!-- Register Form -->
            <div class="tab-pane fade show active" id="register" role="tabpanel">
                <div class="card shadow-sm mb-3" style="max-width: 70%; margin: auto; ">
                    <div class="card-header text-center p-2">Formulario de Registro</div>
                    <div class="card-body p-3">
                        <form id="credit-form" class="needs-validation" novalidate>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label for="client_name" class="form-label">Cliente:</label>
                                    <input type="text" id="client_name" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6">
                                    <label for="issue_date" class="form-label">Fecha de Otorgamiento:</label>
                                    <input type="date" id="issue_date" class="form-control form-control-sm" required>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-4">
                                    <label for="interest_rate" class="form-label">Tasa de Interés:</label>
                                    <input type="number" step="0.01" id="interest_rate" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-4">
                                    <label for="term_months" class="form-label">Plazo (meses):</label>
                                    <input type="number" id="term_months" class="form-control form-control-sm" required inputmode="numeric" pattern="\d+">
                                </div>
                                <div class="col-4">
                                    <label for="amount" class="form-label">Monto:</label>
                                    <input type="number" step="0.01" id="amount" class="form-control form-control-sm" required inputmode="decimal">
                                </div>
                            </div><br>                            
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-sm">Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>            
            <!-- End Register Form -->
            
            <!-- Credit Table -->
            <div class="tab-pane fade" id="list" role="tabpanel">
                <div class="card shadow-sm">
                    <div class="card-header text-center">Créditos Registrados</div>
                    <div class="table-responsive">
                        <table class="table table-hover text-center">
                            <thead class="table-light">
                                <tr>
                                    <th>Cliente</th>
                                    <th>Monto</th>
                                    <th>Tasa de Interés</th>
                                    <th>Plazo (meses)</th>
                                    <th>Fecha de Otorgamiento</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="credits-body"></tbody>
                        </table>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <button type="button" id="prev-page" class="btn btn-outline-primary btn-sm">« Anterior</button>
                        <span id="page-info" class="small text-muted"></span>
                        <button type="button" id="next-page" class="btn btn-outline-primary btn-sm">Siguiente »</button>
                    </div>
                </div>
            </div>
            <!-- End Credit Table -->
        </div>
        <!-- End Tab Content -->

        <!-- Graphs -->
        <div class="tab-pane fade" id="stats" role="tabpanel">
            <div class="card shadow-sm">
                <div class="card-header text-center">Estadísticas</div>
                <div class="card-body">
                    <div class="row">
                        <h2 class="text-center">Total de Créditos Otorgados</h2>
                        <canvas id="credits-chart" style="max-width: 100%; height: 400px;"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for edit credit -->
    <div class="modal fade" id="edit-credit-modal" tabindex="-1" aria-labelledby="edit-credit-modal-label" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="edit-credit-modal-label">Editar Crédito</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-credit-form">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3">
                            <label for="edit-client_name" class="form-label">Cliente</label>
                            <input type="text" class="form-control" id="edit-client_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-amount" class="form-label">Monto</label>
                            <input type="number" step="0.01" class="form-control" id="edit-amount" required inputmode="decimal">
                        </div>
                        <div class="mb-3">
                            <label for="edit-interest_rate" class="form-label">Tasa de Interés (%)</label>
                            <input type="number" step="0.01" class="form-control" id="edit-interest_rate" required>
                        </div>
                        <div class="mb-3">
                            <label for="edit-term_months" class="form-label">Plazo (meses)</label>
                            <input type="number" class="form-control" id="edit-term_months" required inputmode="numeric" pattern="\d+">
                        </div>
                        <div class="mb-3">
                            <label for="edit-issue_date" class="form-label">Fecha de Otorgamiento</label>
                            <input type="date" class="form-control" id="edit-issue_date" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
        <!-- End Modal -->
    </div>
    <script src="/static/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
